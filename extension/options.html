<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Flip Desk — Settings</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 420px; margin: 32px auto; color: #14171C; }
    h1 { font-size: 16px; margin-bottom: 4px; }
    p.sub { color: #6B6F76; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; margin-top: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #E4E4E1; border-radius: 6px; font-size: 13px; }
    button { margin-top: 16px; background: #2E5CE0; color: white; border: none; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: transparent; color: #2E5CE0; border: 1px solid #2E5CE0; margin-left: 8px; }
    #status { margin-top: 12px; font-size: 13px; }
    .ok { color: #1F8A5C; }
    .err { color: #B8452F; }
  </style>
</head>
<body>
  <h1>Flip Desk connection</h1>
  <p class="sub">Point this at your own deployed Flip Desk app, and paste the personal token generated from its Settings page.</p>

  <label for="apiBaseUrl">App URL</label>
  <input id="apiBaseUrl" placeholder="https://your-app.vercel.app" />

  <label for="apiToken">Personal API token</label>
  <input id="apiToken" type="password" placeholder="fd_..." />

  <div>
    <button id="save">Save</button>
    <button id="test" class="secondary">Test Connection</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
